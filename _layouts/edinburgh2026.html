<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}/edinburgh2026/">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | escape }}">
    <meta property="og:image" content="{{ page.image | default: '/assets/images/edinburgh2026-listing.jpg' | absolute_url }}">
    <meta property="og:url" content="{{ site.url }}/edinburgh2026/">
    <link rel="stylesheet" href="{{ '/assets/css/edinburgh2026.css' | relative_url }}">
  </head>
  <body class="edfringe-archive">
    {{ content }}
  </body>
</html>
