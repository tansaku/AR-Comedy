  - type: professional
    publication: "The Real Chrisparkle"
    author: "therealchrisparkle"
    date: "29 Aug 2026"
    hide_stars: true
    url: "https://therealchrisparkle.com/2026/08/29/edinburgh-fringe-reviews-2026-hope-this-helps-behind-closed-doors-fab-goualin-mixed-messages-pierrepoint-the-peoples-hangman-and-i-think-im-turning-japanese-i-really-think/"
    note: "Not on the EdFringe listing snapshot; published independently. Only the paragraph about this show is archived (the original post reviews several shows)."
    body: |
      In 1998 Sam Joseph moved to Japan; a bold and brave step if ever there was. There he became entranced with the country – its people, its food and its language. Even more entrancing was the Japanese lady who would eventually become his wife. Through anecdotes of language mix-ups, poor hotel choices, getting in the wrong taxis, and so on, Sam illustrates what it’s like to be a Brit living in Japan. They also lived in Hawaii, but that’s another story (allegedly to be told at the Fringe next year). Sam is a high-energy, quirky performer; the kind of guy who peppers his speech with random noises and sudden movements. A self-confessed teller of dad jokes, he gives off a children’s entertainer vibe – which I don’t mean unkindly, but you could expect him to make you a balloon animal to take home. If I’m honest, I found his material more informative and curious than funny, but humour is nothing if not subjective, and he’s clearly, as Steve Martin once said, a wild and crazy guy.
