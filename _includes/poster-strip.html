{% assign hl = site.data.highlights %}
{% assign camden = hl.festivals.shows | where: "festival", "Camden Fringe 2026" | first %}
{% if camden == nil %}{% assign camden = hl.festivals.shows | first %}{% endif %}
{% assign jw = hl.joke_wranglers %}
<div class="poster-strip" role="group" aria-label="Show posters">
  <a class="poster-card" href="{% if camden.tickets_url %}{{ camden.tickets_url }}{% else %}#{% endif %}">
    <span class="poster-card-visual">
      <img class="poster-card-img" src="{{ '/assets/images/camden-fringe-2026-poster.jpg' | relative_url }}" width="811" height="1136" loading="eager" decoding="async" alt="Camden Fringe 2026 — I Think I'm Turning Japanese (I Really Think So, NOT!). Museum of Comedy, 13 August.">
    </span>
    <span class="poster-card-label">Camden Fringe · tickets</span>
  </a>
  <a class="poster-card" href="{{ jw.spotify_url }}">
    <span class="poster-card-visual">
      <img class="poster-card-img" src="{{ jw.poster_image | relative_url }}" width="300" height="300" loading="eager" decoding="async" alt="Joke Wranglers podcast — two teams of comedians compete in 10 rounds of joke challenges.">
    </span>
    <span class="poster-card-label">Joke Wranglers · Spotify</span>
  </a>
</div>
